# Lychee configuration file
# Documentation: https://github.com/lycheeverse/lychee#configuration-file

# Maximum number of retries per link
max_retries = 3

# Maximum number of concurrent requests
max_concurrency = 10

# User agent string
user_agent = "Mozilla/5.0 (compatible; Lychee/0.15; +https://github.com/lycheeverse/lychee)"

# Accept these HTTP status codes as valid
accept = [200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308, 429]

# Timeout per request (in seconds)
timeout = 20

# Exclude template URLs that users should replace
exclude = [
  "https://github.com/YOUR-USERNAME/.*",
  "https://YOUR-USERNAME.github.io/.*",
  "https://your-username.github.io/.*",
  "http://localhost.*",
  "https://localhost.*",
  "https://YOUR-ORG.github.io/.*",
  "https://your-org.github.io/.*",
  # Ported from UCD-SERG/lab-manual along with the chapters that link these:
  # Old RStudio blog moved to posit.co; frequently times out in CI
  "https://blog.rstudio.com/.*",
  # Posit support returns 403 for automated checks
  "https://support.posit.co/.*",
  # How-To Geek throws HTTP/2 protocol errors on automated checkers
  "https://www\\.howtogeek\\.com/.*",
  # GitHub PR review pages require authentication
  "https://github.com/pulls/review-requested.*",
  "https://github.com/.*/pulls\\?q=.*review-requested.*",
  # Example preview URLs in documentation (not real URLs)
  "https://preview.*",
  "http://127.0.0.1.*",
  "https://127.0.0.1.*",
  # quarto.org is a trusted site but may be unreachable from CI runners
  "https://quarto.org/.*",
  # These sites return 403 to automated checkers but load for readers
  # (the lab manual accepts 403 globally; excluding the hosts is narrower)
  "https://stackoverflow\\.com/.*",
  "https://softwareengineering\\.stackexchange\\.com/.*",
  "https://www\\.reddit\\.com/.*",
  "https://medium\\.com/.*",
]
