# Lab Python lint and format configuration (Morrison-Lab/psc#90).
# Canonical copy: Morrison-Lab/psc python/ruff.toml.
# Repositories copy this file to their root as ruff.toml.
# Rationale for each setting: chapters/python-style.qmd and docs/adr-python-style.md.

line-length = 80
indent-width = 4

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort import order
  "D",   # pydocstyle, set to the Google convention below
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests do not need docstrings.
"tests/**" = ["D"]
"test_*.py" = ["D"]

[format]
quote-style = "double"
indent-style = "space"
