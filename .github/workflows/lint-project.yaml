# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint-project.yaml

permissions: read-all

jobs:
  lint-project:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install lintr and dependencies
        run: install.packages(c("lintr", "withr"), repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
        shell: Rscript {0}

      - name: Lint root directory
        run: lintr::lint_dir()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  # lms/ is a separate R package (the shared lintr configuration), so it is
  # excluded from the root lint above and linted here as a package, with
  # its own linters and its source loaded so object_usage_linter sees the
  # rex shortcuts its .onLoad() registers. Its tests run here too.
  lint-lms:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: lms
          extra-packages: any::pkgload, any::testthat

      - name: Lint lms as a package
        run: |
          # lms/.lintr.R supplies the linters and exclusions. Without it,
          # lintr would read the root .lintr.R, which excludes lms/ entirely.
          pkgload::load_all("lms")
          lintr::lint_package("lms")
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Test lms
        run: testthat::test_local("lms", stop_on_failure = TRUE)
        shell: Rscript {0}
